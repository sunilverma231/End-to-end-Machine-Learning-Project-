name: CI/CD Pipeline - Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger option

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  EB_APPLICATION_NAME: Student_performance_env_1
  EB_ENVIRONMENT_NAME: studentperformanceenv1-env
  DEPLOY_PACKAGE_NAME: deploy-${{ github.sha }}.zip

jobs:
  # Job 1: Run tests and linting
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8
      
      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Run tests (if test files exist)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No tests directory found, skipping tests"
          fi
        continue-on-error: true

  # Job 2: Build and deploy to AWS
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: test  # Run only after tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create deployment package
        run: |
          # Create clean deployment zip excluding dev files
          zip -r ${{ env.DEPLOY_PACKAGE_NAME }} . \
            -x "*.git*" \
            -x "*myenv/*" \
            -x "*venv/*" \
            -x "*__pycache__/*" \
            -x "*.pyc" \
            -x "*notebook/*" \
            -x "*logs/*" \
            -x "*.egg-info/*" \
            -x "*deploy-*.zip" \
            -x "*.DS_Store" \
            -x "*README.md"
          
          ls -lh ${{ env.DEPLOY_PACKAGE_NAME }}
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eb-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Upload package to S3
        run: |
          aws s3 cp ${{ env.DEPLOY_PACKAGE_NAME }} \
            s3://elasticbeanstalk-${{ env.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }}/${{ env.DEPLOY_PACKAGE_NAME }}
      
      - name: Create EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket="elasticbeanstalk-${{ env.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }}",S3Key="${{ env.DEPLOY_PACKAGE_NAME }}" \
            --description "Deployed via GitHub Actions - Commit ${{ github.sha }}"
      
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --version-label ${{ github.sha }}
      
      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to complete..."
          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }}
      
      - name: Get deployment status
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
            --query "Environments[0].[EnvironmentName,Status,Health]" \
            --output table
      
      - name: Deployment success notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🚀 Application URL: http://${{ env.EB_ENVIRONMENT_NAME }}.eba-wbvx3wpb.${{ env.AWS_REGION }}.elasticbeanstalk.com/"
      
      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs above for details."
          exit 1
