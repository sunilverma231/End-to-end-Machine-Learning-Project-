<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Exam Performance Predictor</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 450px;
            background: #ffffffcc;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(6px);
        }

        h1 {
            text-align: center;
            font-weight: 600;
            color: #4b2faf;
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
            display: block;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0px 0px 5px rgba(106, 17, 203, 0.4);
        }

        .btn-submit {
            width: 100%;
            background: #6a11cb;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #5011a9;
            transform: translateY(-1px);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #f7f5ff;
            border-left: 4px solid #6a11cb;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Student Exam Performance</h1>

        <form action="{{ url_for('predict_datapoint')}}" method="POST">

            <label>Gender</label>
            <select name="gender" required>
                <option disabled selected value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Race / Ethnicity</label>
            <select name="race_ethnicity" required>
                <option disabled selected value="">Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>

            <label>Parental Level of Education</label>
            <select name="parental_level_of_education" required>
                <option disabled selected value="">Select Education Level</option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="high school">High School</option>
                <option value="master's degree">Master's Degree</option>
                <option value="some college">Some College</option>
                <option value="some high school">Some High School</option>
            </select>

            <label>Lunch Type</label>
            <select name="lunch" required>
                <option disabled selected value="">Select Lunch Type</option>
                <option value="free/reduced">Free/Reduced</option>
                <option value="standard">Standard</option>
            </select>

            <label>Test Preparation Course</label>
            <select name="test_preparation_course" required>
                <option disabled selected value="">Select Course</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>

            <label>Reading Score (0–100)</label>
            <input type="number" name="reading_score" min="0" max="100" required>

            <label>Writing Score (0–100)</label>
            <input type="number" name="writing_score" min="0" max="100" required>

            <button class="btn-submit" type="submit">Predict Math Score</button>
        </form>

        {% if prediction %}
        <div class="result-box">
            Predicted Math Score: <strong>{{ prediction }}</strong>
        </div>
        {% endif %}

    </div>
</body>
</html>
